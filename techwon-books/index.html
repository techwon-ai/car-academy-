<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Techwon Books</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--ink:#16191d;--muted:#5d6670;--line:#e2e5e9;--accent:#1f6feb;--accent-ink:#fff;
--good:#1a7f37;--bad:#c62828;--warn:#9a6700;--chip:#eef1f4;--side:#101418;--side-ink:#c9d1d9;--side-active:#1f6feb}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d1117;--panel:#161b22;--ink:#e6edf3;--muted:#8b949e;
--line:#30363d;--accent:#4c8dff;--good:#3fb950;--bad:#f85149;--warn:#d29922;--chip:#21262d;--side:#010409;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0d1117;--panel:#161b22;--ink:#e6edf3;--muted:#8b949e;
--line:#30363d;--accent:#4c8dff;--good:#3fb950;--bad:#f85149;--warn:#d29922;--chip:#21262d;--side:#010409;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
.app{display:flex;min-height:100vh}
nav{width:210px;flex:none;background:var(--side);color:var(--side-ink);padding:16px 10px;position:sticky;top:0;height:100vh;overflow:auto}
nav h1{font-size:17px;margin:4px 10px 18px;color:#fff;letter-spacing:.2px}nav h1 small{display:block;font-weight:400;font-size:11px;color:#8b949e}
nav button{display:block;width:100%;text-align:left;background:none;border:0;color:inherit;padding:8px 10px;border-radius:6px;font-size:14px;cursor:pointer}
nav button:hover{background:#ffffff14}nav button.active{background:var(--side-active);color:#fff}
main{flex:1;min-width:0;padding:22px 26px 60px}
header.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}header.top h2{margin:0;font-size:21px;flex:1}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}.kpi .l{color:var(--muted);font-size:12px}
.kpi .v{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}.kpi .s{font-size:12px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}td.n,th.n{text-align:right;white-space:nowrap}
tr.click{cursor:pointer}tr.click:hover td{background:var(--chip)}tr.total td{font-weight:700;border-top:2px solid var(--ink)}tr.sub td{font-weight:600}
tr.head td{font-weight:700;background:var(--chip)}td.indent{padding-left:24px}
.wrap{overflow-x:auto}
button.b,a.b{background:var(--panel);color:var(--ink);border:1px solid var(--line);padding:7px 12px;border-radius:7px;cursor:pointer;font-size:13px;text-decoration:none;white-space:nowrap}
button.b:hover{border-color:var(--muted)}button.p{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}button.d{color:var(--bad)}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;background:var(--chip);color:var(--muted)}
.pill.paid{color:var(--good)}.pill.overdue{color:var(--bad)}.pill.open,.pill.partial{color:var(--accent)}.pill.draft{color:var(--warn)}.pill.void{text-decoration:line-through}
form.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px 12px;align-items:end}
label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}label.chk{flex-direction:row;align-items:center;gap:6px;color:var(--ink);font-size:13px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}.muted{color:var(--muted)}.right{margin-left:auto}.neg{color:var(--bad)}
.lines td input,.lines td select{width:100%}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;display:none;max-width:90vw;z-index:50}
#toast.err{background:var(--bad);color:#fff}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);max-width:min(860px,96vw);width:860px;padding:0}
dialog::backdrop{background:#0008}dialog .dh{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}dialog .dh h3{margin:0;flex:1}
dialog .db{padding:16px 18px;max-height:75vh;overflow:auto}
.bars{display:flex;gap:10px;align-items:flex-end;height:150px;padding-top:10px}.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.bar i{display:block;width:100%;max-width:48px;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}.bar i.ni{background:var(--good)}.bar i.ni.neg{background:var(--bad)}
.bar .pair{display:flex;gap:3px;align-items:flex-end;height:110px;width:100%;justify-content:center}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;background:var(--accent);vertical-align:-1px}.legend span.g::before{background:var(--good)}
.note{background:var(--chip);border-radius:8px;padding:10px 12px;color:var(--muted);font-size:13px;margin:8px 0}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
@media (max-width:760px){.app{flex-direction:column}nav{width:auto;height:auto;position:static;display:flex;flex-wrap:wrap;gap:2px;padding:8px}
nav h1{width:100%;margin:4px 6px 8px}nav button{width:auto}main{padding:16px}}
.login{max-width:380px;margin:12vh auto;padding:0 16px}.login .card{padding:24px}.login h1{margin:0 0 4px;font-size:22px}
.login form{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.who{margin-top:18px;padding:10px;border-top:1px solid #ffffff22;font-size:12px;color:#8b949e;word-break:break-all}
.who button{padding:6px 10px;font-size:12px}
@media print{nav,header.top .b,.noprint{display:none!important}main{padding:0}.card{border:0}}
</style>
</head>
<body>
<div class="app">
<nav id="nav"><h1><span id="co">Techwon</span><small>Techwon Books</small></h1></nav>
<main id="main"></main>
</div>
<dialog id="dlg"><div class="dh"><h3 id="dlgT"></h3><button class="b" onclick="dlg.close()">Close</button></div><div class="db" id="dlgB"></div></dialog>
<div id="toast"></div>
<script>
"use strict";
// ---------- helpers ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let CUR = "USD";
const fmt = (c, opts={}) => { if (c === null || c === undefined) return "—";
  const s = new Intl.NumberFormat(undefined, {style:"currency", currency:CUR}).format(c/100);
  return opts.color && c < 0 ? `<span class="neg">${s}</span>` : s; };
function toCents(v) { // exact string parse: "1,234.5" -> 123450
  v = String(v ?? "").trim().replace(/[,\s$€£₩]/g, ""); if (v === "") return 0;
  const m = v.match(/^(-)?(\d*)(?:\.(\d{0,2}))?$/); if (!m || (m[2] === "" && !m[3])) throw new Error(`"${v}" is not a valid amount`);
  return (m[1] ? -1 : 1) * (parseInt(m[2] || "0", 10) * 100 + parseInt((m[3] || "").padEnd(2, "0") || "0", 10)); }
const dollars = c => (c/100).toFixed(2);
const today = () => new Date().toISOString().slice(0, 10);
const monthStart = () => today().slice(0, 8) + "01";
function toast(msg, err) { const t = $("#toast"); t.textContent = msg; t.className = err ? "err" : ""; t.style.display = "block";
  clearTimeout(t._h); t._h = setTimeout(() => t.style.display = "none", err ? 6000 : 2500); }
async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  const j = await r.json().catch(() => ({error: "Bad response"}));
  if (r.status === 401 && path !== "/api/login") { showLogin("Your session ended. Please sign in again."); throw new Error("Please sign in"); }
  if (!r.ok) throw new Error(j.error || r.statusText); return j; }
async function act(fn, okMsg) { try { const r = await fn(); if (okMsg) toast(okMsg); return r; } catch (e) { toast(e.message, true); } } // errors are shown, not rethrown
const pill = s => `<span class="pill ${esc(s)}">${esc(s)}</span>`;
function formData(form) { const o = {}; new FormData(form).forEach((v, k) => o[k] = v);
  form.querySelectorAll("input[type=checkbox]").forEach(c => o[c.name] = c.checked); return o; }
const opt = (v, label, sel) => `<option value="${esc(v)}" ${String(v) === String(sel) ? "selected" : ""}>${esc(label)}</option>`;
function openDlg(title, html) { $("#dlgT").textContent = title; $("#dlgB").innerHTML = html; if (!dlg.open) dlg.showModal(); }
function tableCSV(tbl, name) { const rows = [...tbl.querySelectorAll("tr")].map(tr => [...tr.children].map(td =>
  '"' + td.innerText.replace(/"/g, '""') + '"').join(","));
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([rows.join("\n")], {type: "text/csv"}));
  a.download = name + ".csv"; a.click(); }

// cached reference data
let REF = {accounts: [], clients: [], projects: [], vendors: [], settings: {}};
async function loadRef() {
  const [accounts, clients, projects, vendors, settings] = await Promise.all(
    ["/api/accounts", "/api/clients", "/api/projects", "/api/vendors", "/api/settings"].map(p => api(p)));
  REF = {accounts, clients, projects, vendors, settings}; CUR = settings.currency || "USD"; await loadLogo();
  if (LOGO) $("#co").innerHTML = `<img src="${esc(LOGO)}" alt="${esc(settings.company_name)}" style="display:block;max-width:170px;max-height:42px">`;
  else $("#co").textContent = settings.company_name;
  document.title = settings.company_name + " · Books"; }
const acctOpts = (filter, sel) => REF.accounts.filter(a => a.is_active && filter(a)).map(a => opt(a.code, `${a.code} · ${a.name}`, sel)).join("");
const clientOpts = (sel, blank = "— none —") => opt("", blank) + REF.clients.filter(c => c.is_active).map(c => opt(c.id, c.name, sel)).join("");
const projectOpts = (clientId, sel) => opt("", "— none —") + REF.projects.filter(p => (!clientId || p.client_id == clientId) && p.status === "active")
  .map(p => opt(p.id, clientId ? p.name : `${p.client_name} · ${p.name}`, sel)).join("");

// ---------- routing ----------
const PAGES = {dashboard: "Dashboard", invoices: "Invoices", bills: "Bills & Expenses", clients: "Clients & Projects",
  vendors: "Vendors", banking: "Bank Reconciliation", journal: "Journal Entries", accounts: "Chart of Accounts",
  reports: "Reports", settings: "Settings", users: "Users"};
let SESSION = {login_required: false, user: null};
function nav() { const pages = Object.entries(PAGES).filter(([k]) => k !== "users" || SESSION.user?.is_admin);
  $("#nav").innerHTML = $("#nav").querySelector("h1").outerHTML + pages.map(([k, v]) =>
  `<button data-p="${k}" class="${(location.hash.slice(1) || "dashboard").split("/")[0] === k ? "active" : ""}">${v}</button>`).join("")
  + (SESSION.user ? `<div class="who">Signed in as<br><b style="color:#c9d1d9">${esc(SESSION.user.email)}</b><div class="row" style="margin-top:8px">
     <button class="b" onclick="pwDlg()">Change password</button><button class="b" onclick="logout()">Sign out</button></div></div>` : "");
  $("#nav").querySelectorAll("button[data-p]").forEach(b => b.onclick = () => location.hash = b.dataset.p); }
async function render() { if (!$("#nav")) return; nav(); const [p, arg] = (location.hash.slice(1) || "dashboard").split("/");
  try { await loadRef(); await (VIEWS[p] || VIEWS.dashboard)(arg); } catch (e) { $("#main").innerHTML = `<div class="card neg">${esc(e.message)}</div>`; } }
window.addEventListener("hashchange", render);
const page = (title, actions, body) => $("#main").innerHTML = `<header class="top"><h2>${title}</h2>${actions || ""}</header>${body}`;

// ---------- sign in ----------
function showLogin(msg) {
  document.querySelector(".app").innerHTML = `<div class="login"><div class="card"><h1>Techwon Books</h1><p class="muted" style="margin:0">Sign in to your company's books.</p>
   ${SESSION.has_users === false ? `<div class="note">No accounts exist yet. Set <b>ADMIN_EMAIL</b> and <b>ADMIN_PASSWORD</b> in the hosting environment, redeploy, then sign in with them.</div>` : ""}
   ${msg ? `<div class="note">${esc(msg)}</div>` : ""}
   <form id="loginF"><label>Email<input id="lEmail" name="email" type="email" autocomplete="username" required></label>
   <label>Password<input id="lPw" name="password" type="password" autocomplete="current-password" required></label>
   <button class="b p" style="padding:10px">Sign in</button><div id="lErr" class="neg"></div></form></div></div>`;
  $("#loginF").onsubmit = async e => { e.preventDefault(); const f = formData(e.target);
    try { const r = await api("/api/login", f); SESSION.user = r.user; location.reload(); } catch (err) { $("#lErr").textContent = err.message; } };
  $("#lEmail").focus(); }
window.logout = async () => { await api("/api/logout", {}).catch(() => {}); SESSION.user = null; showLogin("You're signed out."); };
window.pwDlg = () => openDlg("Change password", `<form class="grid" id="pwF" onsubmit="event.preventDefault()">
  <label>Current password<input type="password" name="current_password" autocomplete="current-password"></label>
  <label>New password (12+ characters)<input type="password" name="new_password" autocomplete="new-password"></label></form>
  <div class="row"><button class="b p right" onclick="act(async()=>{await api('/api/me/password',formData($('#pwF')));dlg.close();showLogin('Password changed. Sign in with your new password.')},'Password changed')">Change password</button></div>`);

// ---------- views ----------
const VIEWS = {};

VIEWS.users = async () => {
  const users = await api("/api/users");
  page("Users", `<button class="b p" onclick="userForm()">+ Add user</button>`, `<div class="card"><div class="wrap"><table>
  <tr><th>Email</th><th>Name</th><th>Role</th><th>Status</th><th>Added</th><th></th></tr>
  ${users.map(u => `<tr><td>${esc(u.email)}</td><td>${esc(u.name)}</td><td>${u.is_admin ? "Admin" : "Bookkeeper"}</td><td>${u.is_active ? "active" : pill("disabled")}</td><td>${esc(u.created_at.slice(0, 10))}</td>
   <td class="n" style="white-space:nowrap">${u.id === SESSION.user.id ? '<span class="muted">you</span>' : `
    <button class="b" onclick="act(async()=>{await api('/api/users/${u.id}',{is_admin:${!u.is_admin}});render()},'Updated')">${u.is_admin ? "Make bookkeeper" : "Make admin"}</button>
    <button class="b" onclick="resetPw(${u.id})">Reset password</button>
    <button class="b ${u.is_active ? "d" : ""}" onclick="act(async()=>{await api('/api/users/${u.id}',{is_active:${!u.is_active}});render()},'Updated')">${u.is_active ? "Disable" : "Enable"}</button>`}</td></tr>`).join("")}
  </table></div>
  <div class="note">Admins can manage users and settings (including the lock date). Bookkeepers can do everything else. Disabling a user signs them out everywhere.</div></div>`);
};
window.userForm = () => openDlg("Add user", `<form class="grid" id="uF" onsubmit="event.preventDefault()"><label>Email<input name="email" type="email"></label><label>Name<input name="name"></label>
  <label>Temporary password (12+ characters)<input name="password" type="text" autocomplete="off"></label><label class="chk"><input type="checkbox" name="is_admin"> Admin</label></form>
  <p class="muted">Send the password to them privately. They should change it after signing in.</p>
  <div class="row"><button class="b p right" onclick="act(async()=>{await api('/api/users',formData($('#uF')));dlg.close();render()},'User added')">Add user</button></div>`);
window.resetPw = id => openDlg("Reset password", `<form class="grid" id="rpF" onsubmit="event.preventDefault()"><label>New temporary password (12+ characters)<input name="password" type="text" autocomplete="off"></label></form>
  <div class="row"><button class="b p right" onclick="act(async()=>{await api('/api/users/${id}',formData($('#rpF')));dlg.close()},'Password reset; their sessions have ended')">Reset</button></div>`);

VIEWS.dashboard = async () => {
  const d = await api("/api/dashboard");
  const max = Math.max(1, ...d.trend.map(t => Math.max(t.net_revenue_cents, Math.abs(t.net_income_cents))));
  const aging = await api("/api/reports/ar-aging");
  page("Dashboard", `<span class="muted">${esc(d.today)}</span>`, `
  <div class="kpis">
   <div class="kpi"><div class="l">Cash in bank</div><div class="v">${fmt(d.cash_cents, {color: 1})}</div></div>
   <div class="kpi"><div class="l">Owed to you (A/R)</div><div class="v">${fmt(d.ar_cents)}</div><div class="s">${d.overdue_count} overdue · ${fmt(d.overdue_cents)}</div></div>
   <div class="kpi"><div class="l">You owe (A/P)</div><div class="v">${fmt(d.ap_cents)}</div></div>
   <div class="kpi"><div class="l">Net revenue this month</div><div class="v">${fmt(d.mtd_net_revenue_cents)}</div><div class="s">after pass-through media</div></div>
   <div class="kpi"><div class="l">Net income YTD</div><div class="v">${fmt(d.ytd_net_income_cents, {color: 1})}</div><div class="s">${d.ytd_net_margin_pct ?? "—"}% of net revenue</div></div>
   <div class="kpi"><div class="l">Unbilled client expenses</div><div class="v">${fmt(d.unbilled_expenses_cents)}</div><div class="s">${d.unbilled_expenses_cents ? '<a href="#invoices">rebill these →</a>' : "all billed"}</div></div>
  </div>
  <div class="card"><div class="row"><b>Last 6 months</b><div class="legend right"><span>Net revenue</span><span class="g">Net income</span></div></div>
   <div class="bars">${d.trend.map(t => `<div class="bar" title="${t.month}: revenue ${fmt(t.net_revenue_cents)}, income ${fmt(t.net_income_cents)}">
    <div class="pair"><i style="height:${100 * t.net_revenue_cents / max}%"></i><i class="ni ${t.net_income_cents < 0 ? "neg" : ""}" style="height:${100 * Math.abs(t.net_income_cents) / max}%"></i></div>${t.month}</div>`).join("")}</div></div>
  <div class="card"><b>Overdue invoices</b><div class="wrap"><table><tr><th>Invoice</th><th>Client</th><th>Due</th><th class="n">Days late</th><th class="n">Balance</th></tr>
   ${aging.items.filter(i => i.bucket !== "current").map(i => `<tr class="click" onclick="showInvoice(${i.invoice_id})"><td>${esc(i.number)}</td><td>${esc(i.client)}</td><td>${i.due_date}</td><td class="n">${i.days_overdue}</td><td class="n">${fmt(i.balance_cents)}</td></tr>`).join("") || '<tr><td colspan=5 class="muted">Nothing overdue.</td></tr>'}
  </table></div></div>`);
};

// ----- invoices -----
VIEWS.invoices = async () => {
  const inv = await api("/api/invoices"); const unb = await api("/api/unbilled-expenses");
  const byClient = {}; unb.forEach(b => (byClient[b.client_id] ??= {name: b.client_name, total: 0, n: 0}, byClient[b.client_id].total += b.amount_cents, byClient[b.client_id].n++));
  const nVoid = inv.filter(i => i.display_status === "void").length;
  page("Invoices", `<button class="b" onclick="retainerDlg()">Generate retainers</button><button class="b p" onclick="invoiceForm()">+ New invoice</button>`, `
  ${Object.keys(byClient).length ? `<div class="card"><b>Unbilled billable expenses</b><table>${Object.entries(byClient).map(([id, c]) =>
    `<tr><td>${esc(c.name)}</td><td>${c.n} expense(s)</td><td class="n">${fmt(c.total)}</td><td class="n"><button class="b" onclick="rebillDlg(${id})">Rebill…</button></td></tr>`).join("")}</table></div>` : ""}
  <div class="card"><div class="row noprint" style="margin-bottom:8px"><select id="fStatus" onchange="filterInv()"><option value="">All invoices</option>${["draft", "open", "partial", "overdue", "paid"].map(s => opt(s, s[0].toUpperCase() + s.slice(1))).join("")}<option value="void">Deleted (void)${nVoid ? ` · ${nVoid}` : ""}</option></select>
   <input id="fText" placeholder="Search client / number" oninput="filterInv()"><button class="b right" onclick="tableCSV($('#invT'),'invoices')">Export CSV</button></div>
  <div class="wrap"><table id="invT"><tr><th>Number</th><th>Client</th><th>Project</th><th>Date</th><th>Due</th><th>Status</th><th class="n">Total</th><th class="n">Balance</th></tr>
  ${inv.map(i => `<tr class="click" data-s="${i.display_status}" data-t="${esc((i.client_name + " " + (i.number || "draft")).toLowerCase())}" onclick="showInvoice(${i.id})">
   <td>${esc(i.number || "Draft")}</td><td>${esc(i.client_name)}</td><td>${esc(i.project_name || "")}</td><td>${i.issue_date}</td><td>${i.due_date}</td><td>${pill(i.display_status === "void" ? "deleted" : i.display_status)}</td>
   <td class="n">${fmt(i.total_cents)}</td><td class="n">${i.status === "issued" ? fmt(i.balance_cents) : ""}</td></tr>`).join("")}
  <tr id="invEmpty" hidden><td colspan=8 class="muted">No invoices here.</td></tr></table></div></div>`);
  filterInv();
};
// Deleted (void) invoices stay in the books but are hidden unless asked for.
window.filterInv = () => { const s = $("#fStatus").value, t = $("#fText").value.toLowerCase(); let shown = 0;
  document.querySelectorAll("#invT tr[data-s]").forEach(r => { const ok = (s ? r.dataset.s === s : r.dataset.s !== "void") && r.dataset.t.includes(t);
    r.style.display = ok ? "" : "none"; shown += ok; });
  $("#invEmpty").hidden = shown > 0; };

const revOpts = sel => acctOpts(a => a.type === "income", sel);
const lineRow = (l = {}) => `<tr><td><input name="description" value="${esc(l.description || "")}" placeholder="Description"></td>

window.invoiceForm = async (id) => {
  const inv = id ? await api(`/api/invoices/${id}`) : null; const s = REF.settings; const issued = inv?.status === "issued";
  openDlg(!inv ? "New invoice" : issued ? `Edit invoice ${inv.number}` : "Edit draft invoice", `
   ${issued ? `<div class="note" style="margin-top:0">Saving updates <b>${esc(inv.number)}</b> in your books under the same number; the journal keeps a record of the change. If the client already has this invoice, send them the updated copy.</div>` : ""}
   <form id="invF" class="grid" onsubmit="event.preventDefault()">

   <label>Discount value<input name="discount_value" oninput="invCalc()" placeholder="e.g. 10 or 250.00" value="${inv?.discount_type === "percent" ? inv.discount_value / 100 : inv?.discount_type === "amount" ? dollars(inv.discount_value) : ""}"></label>
   <label style="grid-column:1/-1">Note to client <span class="muted">(shown on the invoice; payment details come from Settings)</span><textarea name="notes" rows="2">${esc(inv?.notes || "")}</textarea></label></form>

   ${(inv?.lines || [{}]).map(lineRow).join("")}</table></div>
   <div id="invSum" class="row muted" style="justify-content:flex-end;gap:18px;margin-top:8px;font-variant-numeric:tabular-nums"></div>
   <div class="row" style="margin-top:10px"><button class="b" onclick="$('#invL').insertAdjacentHTML('beforeend', lineRow());invCalc()">+ Line</button>
   ${issued ? `<button class="b p right" onclick="saveInvoice(${id}, false)">Save changes</button>` :
     `<button class="b right" onclick="saveInvoice(${id || 0}, false)">Save draft</button><button class="b p" onclick="saveInvoice(${id || 0}, true)">Save &amp; issue</button>`}</div>`);
  invCalc();
};
function readDiscount(f) { // -> {discount_type, discount_value} in API units (basis points or cents)
  if (!f.discount_type) return {discount_type: "none", discount_value: 0};
  if (!String(f.discount_value).trim()) throw new Error("Enter a discount value, or choose No discount");
  return {discount_type: f.discount_type, discount_value: f.discount_type === "percent" ? pctToBp(f.discount_value) : toCents(f.discount_value)}; }
// Live preview; the server recalculates and is the source of truth.
window.invCalc = () => { const out = $("#invSum"); if (!out) return;
  try { const f = formData($("#invF")); let sub = 0, taxable = 0;
    document.querySelectorAll("#invL tr").forEach((tr, i) => { if (!i) return;
      const q = parseFloat(tr.querySelector("[name=quantity]").value || "1"), amt = Math.round((isNaN(q) ? 0 : q) * toCents(tr.querySelector("[name=unit_price]").value));
      sub += amt; if (tr.querySelector("[name=taxable]").checked) taxable += amt; });
    const d = f.discount_type && String(f.discount_value).trim() ? readDiscount(f) : {discount_type: "none", discount_value: 0};
    const disc = d.discount_type === "percent" ? Math.round(sub * d.discount_value / 10000) : d.discount_type === "amount" ? d.discount_value : 0;
    if (disc && sub > 0) taxable -= Math.round(disc * taxable / sub);
    const tax = Math.round(taxable * pctToBp(f.tax_pct) / 10000);
    out.innerHTML = `<span>Subtotal <b>${fmt(sub)}</b></span>${disc ? `<span>Discount <b class="neg">−${fmt(disc)}</b></span>` : ""}<span>Tax <b>${fmt(tax)}</b></span><span>Total <b style="color:var(--ink)">${fmt(sub - disc + tax)}</b></span>`;
  } catch (e) { out.textContent = e.message; } };
function pctToBp(v) { const c = toCents(v || "0"); if (c < 0) throw new Error("Tax rate cannot be negative"); return c; } // "7.5" -> 750
window.saveInvoice = async (id, issue) => act(async () => {
  const f = formData($("#invF"));
  const lines = [...document.querySelectorAll("#invL tr")].slice(1).map(tr => ({
    description: tr.querySelector("[name=description]").value, quantity: tr.querySelector("[name=quantity]").value || "1",
    unit_price_cents: toCents(tr.querySelector("[name=unit_price]").value), revenue_account_code: tr.querySelector("[name=revenue_account_code]").value,
    taxable: tr.querySelector("[name=taxable]").checked})).filter(l => l.description || l.unit_price_cents);
  const body = {issue_date: f.issue_date, due_date: f.due_date || null, project_id: f.project_id || null, tax_rate_bp: pctToBp(f.tax_pct), notes: f.notes, lines, ...readDiscount(f)};
  const existing = id ? await api(`/api/invoices/${id}`) : null;
  if (existing?.status === "issued") {
    if (!f.due_date) delete body.due_date;
    await api(`/api/invoices/${id}/revise`, body); toast(`${existing.number} updated`);
    await render(); return showInvoice(id); }
  if (id) { if (!f.due_date) delete body.due_date; await api(`/api/invoices/${id}`, {...body, client_id: f.client_id}); }
  else { if (!f.client_id) throw new Error("Choose a client"); id = (await api("/api/invoices", {...body, client_id: f.client_id})).id; }
  if (issue) { const r = await api(`/api/invoices/${id}/issue`, {}); toast(`Issued ${r.number}`); } else toast("Draft saved");
  await render(); showInvoice(id); });

window.showInvoice = async (id) => {
  const i = await api(`/api/invoices/${id}`); await loadLogo();
  const bankOpts = acctOpts(a => a.subtype === "cash");
  const canDelete = i.status === "draft" || (i.status === "issued" && i.paid_cents === 0);
  openDlg(`${i.number || "Draft invoice"} · ${i.client_name}`, `<div class="row noprint" style="margin-bottom:12px">${pill(i.display_status === "void" ? "deleted" : i.display_status)}
   <span class="right"></span>
   ${i.status !== "void" ? `<button class="b" onclick="invoiceForm(${id})">Edit</button>` : ""}
   ${canDelete ? `<button class="b d" onclick="deleteInvoice(${id})">Delete</button>` : ""}
   <button class="b" onclick="printInvoice(${id})">Print / PDF</button>
   ${i.status === "draft" ? `<button class="b p" onclick="issueInv(${id})">Issue invoice</button>` : ""}</div>
   ${i.status === "issued" && i.paid_cents > 0 && i.balance_cents >= 0 ? `<div class="note" style="margin-top:0">This invoice has payments, so it can be edited but not deleted. To delete it, void its payments first.</div>` : ""}
   <div class="paper">${invoiceDoc(i)}</div>
   ${i.payments.length ? `<h4>Payments</h4><table>${i.payments.map(p => `<tr><td>${p.date}</td><td>${esc(p.reference)}</td><td>${esc(p.deposit_account_code)}</td><td class="n">${p.voided ? "<s>" + fmt(p.amount_cents) + "</s> void" : fmt(p.amount_cents)}</td>
     <td class="n">${p.voided ? "" : `<button class="b d" onclick="voidPayment(${p.id},${id})">Void</button>`}</td></tr>`).join("")}</table>` : ""}
   ${i.status === "issued" && i.balance_cents > 0 ? `<h4>Receive payment</h4><form class="grid" id="payF" onsubmit="event.preventDefault()">
     <label>Date<input type="date" name="date" value="${today()}"></label><label>Amount<input name="amount" value="${dollars(i.balance_cents)}"></label>

};

window.loadRec = () => act(async () => { const f = formData($("#recF")); const ws = await api(`/api/reconcile?account_code=${encodeURIComponent(f.acct)}&statement_date=${f.date}`);

     <tr class="head"><td colspan=2>Revenue</td></tr>${sec("", p.revenue)}${amtRow("Gross billings", p.gross_billings_cents, "sub")}
     <tr class="head"><td colspan=2>Less: pass-through costs</td></tr>${sec("", p.passthrough)}
     ${amtRow("Net revenue (agency gross income)", p.net_revenue_cents, "total")}
     <tr class="head"><td colspan=2>Direct client costs</td></tr>${sec("", p.direct_costs)}${amtRow("Total direct costs", p.direct_costs_cents, "sub")}
     ${amtRow(`Gross profit (${pct(p.gross_margin_pct)} of net revenue)`, p.gross_profit_cents, "total")}
     <tr class="head"><td colspan=2>Operating expenses</td></tr>${sec("", p.opex)}${amtRow("Total operating expenses", p.opex_cents, "sub")}
     ${amtRow(`Operating income (${pct(p.operating_margin_pct)})`, p.operating_income_cents, "total")}
     ${p.other.length ? `<tr class="head"><td colspan=2>Other income / expense</td></tr>${sec("", p.other)}` : ""}
     ${amtRow(`Net income (${pct(p.net_margin_pct)} of net revenue)`, p.net_income_cents, "total")}</table></div>
     <div class="note">Agencies are measured on <b>net revenue</b> (billings minus pass-through media), not gross billings. Margins here are % of net revenue.</div>`; }
  if (r === "bs") { const b = await api(`/api/reports/balance-sheet?as_of=${f.as_of}`); const sec = rows => rows.map(x => amtRow(`${x.code} ${x.name}`.trim(), x.amount_cents, "", 1)).join("");
    R.innerHTML = head("Balance Sheet", `As of ${b.as_of} · fiscal year began ${b.fiscal_year_start}`) + `<div class="wrap"><table>
     <tr class="head"><td colspan=2>Assets</td></tr>${sec(b.assets)}${amtRow("Total assets", b.total_assets_cents, "total")}
     <tr class="head"><td colspan=2>Liabilities</td></tr>${sec(b.liabilities)}${amtRow("Total liabilities", b.total_liabilities_cents, "sub")}
     <tr class="head"><td colspan=2>Equity</td></tr>${sec(b.equity)}${amtRow("Total equity", b.total_equity_cents, "sub")}
     ${amtRow("Total liabilities & equity", b.total_liabilities_cents + b.total_equity_cents, "total")}</table></div>
     <p>${b.balanced ? '<span style="color:var(--good)">✓ Balanced</span>' : '<span class="neg">✗ OUT OF BALANCE — investigate</span>'}</p>`; }

    R.innerHTML = head("Trial Balance", `As of ${t.as_of}`) + `<div class="wrap"><table><tr><th>Code</th><th>Account</th><th class="n">Debit</th><th class="n">Credit</th></tr>
     ${t.rows.map(x => `<tr class="click" onclick="location.hash='reports/gl:${x.code}'"><td>${x.code}</td><td>${esc(x.name)}</td><td class="n">${x.tb_debit_cents ? fmt(x.tb_debit_cents) : ""}</td><td class="n">${x.tb_credit_cents ? fmt(x.tb_credit_cents) : ""}</td></tr>`).join("")}
     <tr class="total"><td></td><td>Total</td><td class="n">${fmt(t.total_debit_cents)}</td><td class="n">${fmt(t.total_credit_cents)}</td></tr></table></div>
     <p>${t.balanced ? '<span style="color:var(--good)">✓ Debits equal credits</span>' : '<span class="neg">✗ Out of balance</span>'}</p>`; }
  if (r === "ar" || r === "ap") { const a = await api(`/api/reports/${r}-aging?as_of=${f.as_of}`); const key = r === "ar" ? "client" : "vendor"; const rows = a["by_" + key];
    const B = ["current", "1_30", "31_60", "61_90", "over_90"], L = ["Current", "1–30", "31–60", "61–90", "90+"];
    R.innerHTML = head(r === "ar" ? "Accounts Receivable Aging" : "Accounts Payable Aging", `As of ${a.as_of} · days past due`) + `<div class="wrap"><table><tr><th>${key[0].toUpperCase() + key.slice(1)}</th>${L.map(l => `<th class="n">${l}</th>`).join("")}<th class="n">Total</th></tr>
     ${rows.map(x => `<tr><td>${esc(x[key])}</td>${B.map(b => `<td class="n">${x[b] ? fmt(x[b]) : ""}</td>`).join("")}<td class="n"><b>${fmt(x.total)}</b></td></tr>`).join("") || '<tr><td colspan=7 class="muted">Nothing outstanding.</td></tr>'}
     <tr class="total"><td>Total</td>${B.map(b => `<td class="n">${fmt(a.totals[b])}</td>`).join("")}<td class="n">${fmt(a.totals.total)}</td></tr></table></div>
     <h4>Detail</h4><div class="wrap"><table><tr><th>${r === "ar" ? "Invoice" : "Bill"}</th><th>${key}</th><th>Due</th><th class="n">Days late</th><th class="n">Balance</th></tr>
     ${a.items.map(i => `<tr ${r === "ar" ? `class="click" onclick="showInvoice(${i.invoice_id})"` : ""}><td>${esc(i.number || i.description)}</td><td>${esc(i[key])}</td><td>${i.due_date}</td><td class="n">${i.days_overdue}</td><td class="n">${fmt(i.balance_cents)}</td></tr>`).join("")}</table></div>`; }
  if (r === "cp") { const c = await api(`/api/reports/client-profitability?start=${f.start}&end=${f.end}`);
    R.innerHTML = head("Client Profitability", `${c.start} to ${c.end}`) + `<div class="wrap"><table><tr><th>Client</th><th class="n">Gross billings</th><th class="n">Pass-through</th><th class="n">Net revenue</th><th class="n">Direct costs</th><th class="n">Contribution</th><th class="n">Margin</th></tr>
     ${c.rows.map(x => `<tr><td>${esc(x.client)}</td><td class="n">${fmt(x.gross_billings_cents)}</td><td class="n">${fmt(x.passthrough_cents)}</td><td class="n">${fmt(x.net_revenue_cents)}</td><td class="n">${fmt(x.direct_costs_cents)}</td><td class="n">${fmt(x.contribution_cents, {color: 1})}</td><td class="n">${pct(x.margin_pct)}</td></tr>`).join("") || '<tr><td colspan=7 class="muted">No client-tagged activity.</td></tr>'}</table></div>
     <div class="note">⚠ ${esc(c.note)} Track staff hours per client if you want true profitability.</div>`; }
  if (r === "pp") { const c = await api(`/api/reports/project-profitability?start=${f.start}&end=${f.end}`);
    R.innerHTML = head("Project Profitability", `${c.start} to ${c.end}`) + `<div class="wrap"><table><tr><th>Client</th><th>Project</th><th>Status</th><th class="n">Budget</th><th class="n">Billed</th><th class="n">% of budget</th><th class="n">Costs</th><th class="n">Contribution</th><th class="n">Margin</th></tr>
     ${c.rows.map(x => `<tr><td>${esc(x.client)}</td><td>${esc(x.project)}</td><td>${x.status}</td><td class="n">${x.budget_cents ? fmt(x.budget_cents) : ""}</td><td class="n">${fmt(x.gross_billings_cents)}</td><td class="n">${pct(x.budget_billed_pct)}</td><td class="n">${fmt(x.costs_cents)}</td><td class="n">${fmt(x.contribution_cents, {color: 1})}</td><td class="n">${pct(x.margin_pct)}</td></tr>`).join("") || '<tr><td colspan=9 class="muted">No projects.</td></tr>'}</table></div>`; }
  if (r === "gl") { const g = await api(`/api/reports/general-ledger?account_code=${encodeURIComponent(f.acct)}&start=${f.start}&end=${f.end}`);
    R.innerHTML = head(`General Ledger — ${esc(g.account.code)} ${esc(g.account.name)}`, `${g.start} to ${g.end}`) + `<div class="wrap"><table><tr><th>Date</th><th>Entry</th><th>Description</th><th>Client</th><th class="n">Debit</th><th class="n">Credit</th><th class="n">Balance</th></tr>
     <tr class="sub"><td></td><td></td><td>Opening balance</td><td></td><td></td><td></td><td class="n">${fmt(g.opening_balance_cents, {color: 1})}</td></tr>
     ${g.lines.map(l => `<tr><td>${l.date}</td><td>#${l.entry_id}</td><td>${esc(l.entry_memo)}${l.memo && l.memo !== l.entry_memo ? " — " + esc(l.memo) : ""}</td><td>${esc(l.client_name || "")}</td><td class="n">${l.debit_cents ? fmt(l.debit_cents) : ""}</td><td class="n">${l.credit_cents ? fmt(l.credit_cents) : ""}</td><td class="n">${fmt(l.running_balance_cents, {color: 1})}</td></tr>`).join("")}
     <tr class="total"><td></td><td></td><td>Closing balance</td><td></td><td></td><td></td><td class="n">${fmt(g.closing_balance_cents, {color: 1})}</td></tr></table></div>`; }
});

// ----- settings -----
VIEWS.settings = async () => { const s = REF.settings; await loadLogo();
  page("Settings", "", `<div class="card"><h3 style="margin-top:0">Invoice branding</h3>
  <div class="row" style="align-items:center;gap:16px;margin-bottom:14px">
   <div style="background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 16px;min-width:220px;min-height:70px;display:flex;align-items:center">
    ${LOGO ? `<img src="${esc(LOGO)}" alt="Logo" style="max-height:54px;max-width:240px">` : `<span class="muted">No logo yet: invoices show your company name.</span>`}</div>
   <label class="b" style="flex-direction:row;cursor:pointer">${LOGO ? "Replace logo" : "Upload logo"}<input type="file" id="logoFile" accept="image/png,image/jpeg,image/webp,image/svg+xml" hidden onchange="uploadLogo(this.files[0])"></label>
   ${LOGO_CUSTOM ? `<button class="b d" onclick="act(async()=>{await api('/api/logo',{logo:''});LOGO=null;render()},'Back to the standard Techwon logo')">Use standard logo</button>` : ""}
   <span class="muted" style="font-size:12px">PNG with a transparent background works best. Empty margins are trimmed automatically.</span></div>
  <form class="grid" id="bF" onsubmit="event.preventDefault()">
  <label style="grid-column:span 2">Company address<textarea name="company_address" rows="3">${esc(s.company_address)}</textarea></label>
  <label>Billing email<input name="company_email" value="${esc(s.company_email)}"></label>
  <label>Phone<input name="company_phone" value="${esc(s.company_phone)}"></label>
  <label>Website<input name="company_website" value="${esc(s.company_website)}"></label>
  <label>Tax / VAT / GST number<input name="company_tax_id" value="${esc(s.company_tax_id)}"></label>
  <label>Brand colour<input type="color" name="brand_color" value="${esc(brandColor())}" style="height:34px;padding:2px"></label>
  <label style="grid-column:span 2">How to pay (bank details, payment link)<textarea name="payment_instructions" rows="3" placeholder="Bank: …&#10;Account: …&#10;Reference: invoice number">${esc(s.payment_instructions)}</textarea></label>
  <label style="grid-column:span 2">Footer line<input name="invoice_footer" value="${esc(s.invoice_footer)}"></label></form>
  <div class="row"><button class="b p right" onclick="act(async()=>{await api('/api/settings',formData($('#bF')));render()},'Invoice branding saved')">Save branding</button></div></div>
  <div class="card"><h3 style="margin-top:0">Books</h3><form class="grid" id="sF" onsubmit="event.preventDefault()">
  <label>Company name<input name="company_name" value="${esc(s.company_name)}"></label>
  <label>Currency (ISO code)<input name="currency" value="${esc(s.currency)}" maxlength="3"></label>
  <label>Fiscal year starts (month 1–12)<input name="fiscal_year_start_month" type="number" min="1" max="12" value="${esc(s.fiscal_year_start_month)}"></label>
  <label>Default tax rate %<input name="tax_pct" value="${+s.default_tax_rate_bp / 100}"></label>
  <label>Invoice prefix<input name="invoice_prefix" value="${esc(s.invoice_prefix)}"></label>
  <label>Next invoice number<input name="next_invoice_number" type="number" min="1" value="${esc(s.next_invoice_number)}"></label>
  <label>Books locked through<input type="date" name="lock_date" value="${esc(s.lock_date)}"></label></form>
  <div class="note">The <b>lock date</b> closes a period: nothing can be posted, edited or voided on or before it. Set it after you file a return or your accountant signs off on a month.</div>
  <div class="row"><button class="b p right" onclick="saveSettings()">Save settings</button></div></div>`); };
window.saveSettings = () => act(async () => { const f = formData($("#sF")); f.default_tax_rate_bp = pctToBp(f.tax_pct); delete f.tax_pct; f.currency = f.currency.toUpperCase();
  try { new Intl.NumberFormat(undefined, {style: "currency", currency: f.currency}); } catch { throw new Error("Unknown currency code"); }
  await api("/api/settings", f); render(); }, "Settings saved");

// ----- logo -----
let LOGO = null, LOGO_CUSTOM = false;
async function loadLogo(force) { if (LOGO === null || force) { try { const r = await api("/api/logo"); LOGO = r.logo || ""; LOGO_CUSTOM = !!r.custom; } catch { LOGO = ""; } } return LOGO; }
// Crop away empty (transparent or white) margins so a square logo file doesn't render tiny.
function trimLogo(dataUrl) { return new Promise(resolve => { const img = new Image();
  img.onload = () => { try {
    const c = document.createElement("canvas"), W = img.naturalWidth, H = img.naturalHeight; c.width = W; c.height = H;
    const x = c.getContext("2d"); x.drawImage(img, 0, 0); const d = x.getImageData(0, 0, W, H).data;
    let t = H, l = W, r = -1, b = -1;
    for (let y = 0; y < H; y++) for (let xx = 0; xx < W; xx++) { const k = (y * W + xx) * 4;
      if (d[k + 3] > 16 && !(d[k] > 245 && d[k + 1] > 245 && d[k + 2] > 245)) { if (y < t) t = y; if (y > b) b = y; if (xx < l) l = xx; if (xx > r) r = xx; } }
    if (r < 0) return resolve(dataUrl);
    const pad = 4; l = Math.max(0, l - pad); t = Math.max(0, t - pad); r = Math.min(W - 1, r + pad); b = Math.min(H - 1, b + pad);
    const scale = Math.min(1, 1200 / (r - l + 1)), o = document.createElement("canvas");
    o.width = Math.round((r - l + 1) * scale); o.height = Math.round((b - t + 1) * scale);
    o.getContext("2d").drawImage(c, l, t, r - l + 1, b - t + 1, 0, 0, o.width, o.height);
    resolve(o.toDataURL("image/png")); } catch { resolve(dataUrl); } };
  img.onerror = () => resolve(dataUrl); img.src = dataUrl; }); }
window.uploadLogo = file => file && act(async () => {
  if (file.size > 2_000_000) throw new Error("That image is over 2 MB. Use a smaller PNG or SVG.");
  let data = await new Promise((ok, bad) => { const fr = new FileReader(); fr.onload = () => ok(fr.result); fr.onerror = bad; fr.readAsDataURL(file); });
  if (!data.startsWith("data:image/svg")) data = await trimLogo(data);
  await api("/api/logo", {logo: data}); LOGO = null; render(); }, "Logo uploaded");

(async () => { const f = formData($("#sF")); f.default_tax_rate_bp = pctToBp(f.tax_pct); delete f.tax_pct; f.currency = f.currency.toUpperCase();
  try { new Intl.NumberFormat(undefined, {style: "currency", currency: f.currency}); } catch { throw new Error("Unknown currency code"); }
  await api("/api/settings", f); render(); }, "Settings saved");

(async () => {
  try { SESSION = await (await fetch("/api/session")).json(); } catch { SESSION = {login_required: false}; }
  if (SESSION.login_required && !SESSION.user) return showLogin();
  if (location.hash === "#users" && !SESSION.user?.is_admin) location.hash = "dashboard";
  render();
})();
</script>
